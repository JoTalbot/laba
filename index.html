<!doctype html>
<html lang="uk">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>111ЛАБ</title><style>body{font-family:system-ui,sans-serif;background:#f5f7fb;margin:0;color:#172033}main{max-width:920px;margin:40px auto;padding:28px;background:#fff;border-radius:18px;box-shadow:0 8px 40px #0001}h1{margin-top:0}.drop{border:2px dashed #9aa7bd;padding:34px;border-radius:14px;text-align:center}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}label{font-weight:600}input,select{width:100%;box-sizing:border-box;padding:11px;margin-top:6px}button{margin-top:18px;padding:12px 18px;border:0;border-radius:10px;background:#1f6feb;color:#fff;font-weight:700;cursor:pointer}pre{background:#111827;color:#e5e7eb;padding:16px;border-radius:12px;overflow:auto}@media(max-width:700px){.row{grid-template-columns:1fr}}</style></head>
<body><main><h1>111ЛАБ 🧪</h1><p>Загрузите PDF лабораторной работы, укажите данные студента и получите оформленный отчёт по шаблону.</p><div class="drop"><input id="pdf" type="file" accept=".pdf"><p id="status">PDF не выбран</p></div><div class="row"><label>Студент<input id="student" placeholder="Студент гр. КН-25 Иванов И.И."></label><label>Дисциплина<input id="discipline" placeholder="Алгоритми та структури даних"></label><label>Преподаватель<input id="teacher" placeholder="ФИО преподавателя"></label><label>Язык<select id="lang"><option>C++</option><option>Python</option><option>Java</option></select></label></div><button id="go">Сгенерировать 111ЛАБ.pdf</button><pre id="out">Готово.</pre></main><script>const f=document.querySelector('#pdf'),s=document.querySelector('#status'),o=document.querySelector('#out');f.onchange=()=>s.textContent=f.files[0]?.name||'PDF не выбран';document.querySelector('#go').onclick=()=>o.textContent=f.files[0]?'Интерфейс готов. Для реальной генерации подключается backend API (/api/solve → /api/render).':'Выберите PDF задания.';</script></body></html>
