<!doctype html>
<html lang="uk">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>111ЛАБ</title><style>body{font-family:system-ui,sans-serif;background:#f5f7fb;margin:0;color:#172033}main{max-width:920px;margin:32px auto;padding:28px;background:#fff;border-radius:18px}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}input,select{width:100%;box-sizing:border-box;padding:11px;margin-top:6px}button{margin-top:18px;padding:12px 18px;border:0;border-radius:10px;background:#1f6feb;color:#fff;font-weight:700}@media(max-width:700px){.row{grid-template-columns:1fr}}</style></head>
<body><main><h1>111ЛАБ 🧪</h1><p>PDF лабораторной → анализ → решение → оформление → <b>111ЛАБ.pdf</b>.</p><label>Backend API<input id="api" placeholder="https://your-server.example.com"></label><p><input id="pdf" type="file" accept="application/pdf"></p><div class="row"><label>Студент<input id="student" placeholder="Студент гр. КН-25 Гончаренко А.К"></label><label>Дисциплина<input id="discipline" placeholder="Алгоритми та структури даних. Базові концепції"></label><label>Преподаватель<input id="teacher" placeholder="ФИО преподавателя"></label><label>Язык<select id="lang"><option>C++</option><option>Python</option><option>Java</option></select></label></div><button id="inspect">Распознать</button> <button id="go">Сгенерировать 111ЛАБ.pdf</button><pre id="out">Готово.</pre></main><script>const $=x=>document.getElementById(x);async function req(path,fd){const r=await fetch($('api').value.replace(/\/$/,'')+path,{method:'POST',body:fd});if(!r.ok)throw Error(await r.text());return r}$("inspect").onclick=async()=>{try{let f=$("pdf").files[0];if(!f)throw Error('Выберите PDF');let d=new FormData();d.append('file',f);$("out").textContent=JSON.stringify(await(await req('/api/inspect',d)).json(),null,2)}catch(e){$("out").textContent=e.message}};$("go").onclick=async()=>{try{let f=$("pdf").files[0];if(!f)throw Error('Выберите PDF');let d=new FormData();d.append('file',f);d.append('student',$('student').value);d.append('teacher',$('teacher').value);d.append('discipline',$('discipline').value);d.append('conclusion','Під час виконання лабораторної роботи було закріплено теоретичні знання та набуто практичних навичок. Результати виконання завдань перевірено тестуванням.');let r=await req('/api/generate',d),a=document.createElement('a');a.href=URL.createObjectURL(await r.blob());a.download='111ЛАБ.pdf';a.click();$("out").textContent='Готово: 111ЛАБ.pdf'}catch(e){$("out").textContent=e.message}};</script></body></html>
